services:
  - type: web
    name: spendwise-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard when creating the Blueprint.
      # Never commit real values to this file.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
